# Markdown linting rules
# https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

# Default to all rules enabled
default: true

# Allow long lines (Markdown is meant to be readable; line wrapping is editor concern)
MD013: false

# Allow inline HTML (we use <details>, <img> etc. in README badges)
MD033: false

# Allow duplicate headings under different parents (FAQ-style docs)
MD024:
  siblings_only: true

# Allow first line not to be H1 (some files start with badges or front-matter)
MD041: false

# MD036: bold-as-heading false positives on README tagline
MD036: false
